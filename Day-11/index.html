<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration - Day 9</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
      <a class="navbar-brand" href="index.html">🎓 Student Registration Portal</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav">
          <li class="nav-item">
            <a class="nav-link active fw-bold text-white" href="index.html">Register</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="students.php">Student Records</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container pb-5">
    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h3 class="mb-0">🎓 Student Registration</h3>
          </div>

          <div class="card-body">
            <p class="text-muted">

            </p>

            <!--
              method="post" keeps data out of the URL.
              action="process_form.php" is the PHP file that validates
              and inserts this data into MySQL.
            -->
            <form action="process_form.php" method="post">

              <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" name="name"
                       placeholder="e.g. Piyush Sharma" required />
              </div>

              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" name="email"
                       placeholder="e.g. piyush@example.com" required />
              </div>

              <div class="mb-3">
                <label for="cgpa" class="form-label">CGPA</label>
                <input type="number" step="0.01" min="0" max="10" class="form-control"
                       id="cgpa" name="cgpa" placeholder="e.g. 8.7" required />
              </div>

              <div class="mb-3">
                <label for="branch" class="form-label">Branch</label>
                <select class="form-select" id="branch" name="branch" required>
                  <option value="" selected disabled>Choose your branch</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Mechanical">Mechanical</option>
                  <option value="Civil">Civil</option>
                </select>
              </div>

              <div class="mb-3">
                <label for="course" class="form-label">Course</label>
                <input type="text" class="form-control" id="course" name="course"
                       placeholder="e.g. B.Tech" />
              </div>

              <div class="mb-3">
                <label for="address" class="form-label">Address</label>
                <textarea class="form-control" id="address" name="address" rows="2"
                          placeholder="e.g. Malviya Nagar, Jaipur"></textarea>
              </div>

              <div class="mb-3">
                <label for="photo" class="form-label">Profile Photo</label>
                <!--
                  Display-only for now, as instructed in the assignment —
                  no server-side upload handling yet, just the UI.
                -->
                <input type="file" class="form-control" id="photo" name="photo" accept="image/*" />
                <div class="form-text">Upload is UI-only for now — files aren't saved yet.</div>
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Submit Registration
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-4">
    <hr />
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
