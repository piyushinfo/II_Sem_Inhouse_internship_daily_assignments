<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f0f4f8; }
    .form-card {
      background: white;
      border-radius: 14px;
      padding: 35px;
      max-width: 600px;
      margin: 50px auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    .form-title {
      background-color: #1a1a2e;
      color: white;
      text-align: center;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 25px;
    }
    .form-title h3 { margin: 0; }
    .form-title p  { margin: 0; color: #00d4ff; font-size: 13px; }
    .btn-register {
      background-color: #1a1a2e;
      color: white;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      margin-top: 10px;
    }
    .btn-register:hover { background-color: #00d4ff; color: #1a1a2e; }
    label { font-weight: 600; font-size: 14px; }
    .photo-preview {
      width: 80px; height: 80px;
      border-radius: 50%;
      background-color: #eee;
      display: flex; align-items: center; justify-content: center;
      font-size: 32px;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="form-card">

  <div class="form-title">
    <h3>🎓 Student Registration</h3>
    <p>Fill in all details below</p>
  </div>

  <!-- form sends POST data to process.php -->
  <form method="POST" action="process.php" enctype="multipart/form-data">

    <!-- Profile Photo (Assignment: Photo Upload UI) -->
    <div class="mb-3 text-center">
      <div class="photo-preview mx-auto">🧑‍💻</div>
      <label for="photo" class="form-label">Profile Photo</label>
      <input type="file" class="form-control" id="photo" name="photo" accept="image/*">
      <small class="text-muted">Optional — JPEG or PNG</small>
    </div>

    <hr>

    <!-- Name -->
    <div class="mb-3">
      <label for="name">Full Name *</label>
      <input type="text" class="form-control" id="name" name="name" placeholder="Enter your full name">
    </div>

    <!-- Email -->
    <div class="mb-3">
      <label for="email">Email Address *</label>
      <input type="text" class="form-control" id="email" name="email" placeholder="Enter your email">
    </div>

    <!-- Branch -->
    <div class="mb-3">
      <label for="branch">Branch *</label>
      <input type="text" class="form-control" id="branch" name="branch" placeholder="e.g. Computer Science">
    </div>

    <!-- Phone -->
    <div class="mb-3">
      <label for="phone">Phone Number *</label>
      <input type="text" class="form-control" id="phone" name="phone" placeholder="10-digit mobile number">
    </div>

    <!-- Gender (Assignment: Radio Buttons) -->
    <div class="mb-3">
      <label>Gender *</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="male" value="Male">
        <label class="form-check-label" for="male">Male</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="female" value="Female">
        <label class="form-check-label" for="female">Female</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="radio" name="gender" id="other" value="Other">
        <label class="form-check-label" for="other">Other</label>
      </div>
    </div>

    <!-- Course (Assignment: Dropdown) -->
    <div class="mb-3">
      <label for="course">Course *</label>
      <select class="form-select" id="course" name="course">
        <option value="">-- Select Course --</option>
        <option value="B.Tech">B.Tech</option>
        <option value="B.Sc">B.Sc</option>
        <option value="BCA">BCA</option>
        <option value="MCA">MCA</option>
        <option value="M.Tech">M.Tech</option>
      </select>
    </div>

    <!-- Address (Assignment: Textarea) -->
    <div class="mb-3">
      <label for="address">Address *</label>
      <textarea class="form-control" id="address" name="address" rows="3" placeholder="Enter your full address (min 10 characters)"></textarea>
    </div>

    <button type="submit" class="btn-register">Register Now →</button>

  </form>

</div>

</body>
</html>
