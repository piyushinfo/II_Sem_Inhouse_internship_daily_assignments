<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration - Day 8</title>

  <!-- Bootstrap 5 CSS via CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
</head>
<body class="bg-light">

  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-7">

        <div class="card shadow-sm">
          <div class="card-header bg-primary text-white">
            <h3 class="mb-0">🎓 Student Registration</h3>
          </div>

          <div class="card-body">
            <p class="text-muted">
              </p>

            <!-- 
              method="post" keeps the submitted data out of the URL.
              action="process.php" is the PHP file that will handle this form.
            -->
            <form action="process.php" method="post">

              <!-- Name -->
              <div class="mb-3">
                <label for="student_name" class="form-label">Full Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="student_name"
                  name="student_name"
                  placeholder="e.g. Piyush Sharma"
                  required
                />
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="e.g. piyush@example.com"
                  required
                />
              </div>

              <!-- CGPA -->
              <div class="mb-3">
                <label for="cgpa" class="form-label">CGPA</label>
                <input
                  type="number"
                  step="0.01"
                  min="0"
                  max="10"
                  class="form-control"
                  id="cgpa"
                  name="cgpa"
                  placeholder="e.g. 8.7"
                  required
                />
              </div>

              <!-- Branch -->
              <div class="mb-3">
                <label for="branch" class="form-label">Branch</label>
                <select class="form-select" id="branch" name="branch" required>
                  <option value="" selected disabled>Choose your branch</option>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Information Technology">Information Technology</option>
                  <option value="Electronics">Electronics</option>
                  <option value="Mechanical">Mechanical</option>
                  <option value="Civil">Civil</option>
                </select>
              </div>

              <!-- College -->
              <div class="mb-3">
                <label for="college" class="form-label">College Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="college"
                  name="college"
                  placeholder="e.g. SKIT Jaipur"
                  required
                />
              </div>

              <button type="submit" class="btn btn-primary w-100">
                Submit Registration
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>

  <!-- Bootstrap JS Bundle (for future navbar/dropdown use) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
